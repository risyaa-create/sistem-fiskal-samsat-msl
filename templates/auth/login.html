{% extends "base.html" %}

{% block title %}Login Petugas{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <h2>Masuk ke Sistem</h2>
            <p>Akses Khusus Pegawai Tata Usaha SAMSAT Medan Selatan</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group" style="margin-bottom: 1.25rem;">
                <label class="form-label" for="username">Username / NIP</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    class="form-control" 
                    placeholder="Masukkan username Anda" 
                    required 
                    autofocus
                >
            </div>

            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label class="form-label" for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-control" 
                    placeholder="Masukkan password" 
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
                🔐 Masuk ke Sistem
            </button>
        </form>

        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.88rem; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
            Belum memiliki akun petugas? 
            <a href="{{ url_for('register') }}" style="color: var(--primary-color); font-weight: 700; text-decoration: none;">
                Daftar di sini &rarr;
            </a>
        </div>
    </div>
</div>
{% endblock %}
